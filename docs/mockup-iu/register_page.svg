<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" style="background-color: #F3F4F6; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">

  <rect width="100%" height="100%" fill="#F9FAFB" />

  <rect width="1200" height="60" fill="#ffffff" stroke="#e0e0e0" />
  <text x="60" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#007bff">PickAuto</text>
  
  <rect x="250" y="15" width="500" height="30" rx="4" fill="#f1f3f5" />
  <text x="265" y="35" font-family="Arial, sans-serif" font-size="12" fill="#adb5bd">Search premium vehicles, parts, or services...</text>
  <rect x="760" y="15" width="30" height="30" rx="4" fill="#f1f3f5" />
  <text x="775" y="35" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">🔍</text>

  <g transform="translate(1050, 15)">
      <circle cx="15" cy="15" r="15" fill="#E5E7EB" />
      <path d="M8 25 A 10 10 0 0 1 22 25" stroke="#9CA3AF" stroke-width="2" fill="none" />
      <circle cx="15" cy="12" r="4" fill="#9CA3AF" />
      <text x="-80" y="12" font-size="12" font-weight="bold" text-anchor="end" fill="#374151">Guest User</text>
      <text x="-75" y="26" font-size="10" text-anchor="end" fill="#007bff">Sign In / Register</text>
  </g>

  <g transform="translate(350, 100)">
    <rect width="500" height="1250" rx="12" fill="#ffffff" stroke="#E5E7EB" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))" />

    <g transform="translate(40, 50)">
      <text x="0" y="0" font-size="28" font-weight="bold" fill="#111827">Create Your Account</text>
      <text x="0" y="30" font-size="14" fill="#6B7280">Join thousands of automotive enthusiasts and find</text>
      <text x="0" y="50" font-size="14" fill="#6B7280">your perfect drive today.</text>
    </g>

    <line x1="0" y1="120" x2="500" y2="120" stroke="#F3F4F6" />

    <g transform="translate(40, 150)">
      
      <g transform="translate(0, 0)">
          <text x="0" y="0" font-size="14" font-weight="bold" fill="#374151">Full Name</text>
          <rect x="0" y="10" width="420" height="45" rx="6" fill="#FFFFFF" stroke="#D1D5DB" />
          <text x="15" y="38" font-size="14" fill="#111827">Ibai Martiarena</text>
      </g>

      <g transform="translate(0, 80)">
          <text x="0" y="0" font-size="14" font-weight="bold" fill="#374151">Email Address*</text>
          <rect x="0" y="10" width="420" height="45" rx="6" fill="#FFF5F5" stroke="#EF4444" />
          <text x="15" y="38" font-size="14" fill="#111827">marti@example.com</text>
          <text x="0" y="70" font-size="12" fill="#EF4444">⚠ This email is already registered.</text>
      </g>

      <g transform="translate(0, 170)">
          <text x="0" y="0" font-size="14" font-weight="bold" fill="#374151">Username</text>
          <rect x="0" y="10" width="420" height="45" rx="6" fill="#FFFFFF" stroke="#D1D5DB" />
          <text x="15" y="38" font-size="14" fill="#111827">marti_driver99</text>
      </g>

      <g transform="translate(0, 250)">
          <text x="0" y="0" font-size="14" font-weight="bold" fill="#374151">Phone Number*</text>
          <rect x="0" y="10" width="420" height="45" rx="6" fill="#FFFFFF" stroke="#D1D5DB" />
          <text x="15" y="38" font-size="14" fill="#111827">+34 000-000-000</text>
      </g>

      <g transform="translate(0, 330)">
          <text x="0" y="0" font-size="14" font-weight="bold" fill="#374151">Password</text>
          <rect x="0" y="10" width="420" height="45" rx="6" fill="#FFFFFF" stroke="#D1D5DB" />
          <text x="15" y="42" font-size="18" fill="#111827">••••••••</text>
          <text x="380" y="38" font-size="12" fill="#007bff" text-anchor="end" font-weight="bold">Show</text>
          <text x="0" y="70" font-size="12" fill="#6B7280">Min. 8 characters</text>
      </g>

      <g transform="translate(0, 420)">
          <text x="0" y="0" font-size="14" font-weight="bold" fill="#374151">Confirm Password*</text>
          <rect x="0" y="10" width="420" height="45" rx="6" fill="#FFFFFF" stroke="#D1D5DB" />
          <text x="15" y="38" font-size="14" fill="#9CA3AF">Repeat your password</text>
      </g>

      <g transform="translate(0, 500)">
          <text x="0" y="0" font-size="14" font-weight="bold" fill="#374151">Residential Address</text>
          <rect x="0" y="10" width="420" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB" />
          <text x="15" y="38" font-size="14" fill="#9CA3AF">Street, City, State, ZIP Code</text>
          <text x="0" y="105" font-size="11" fill="#6B7280">Used for localized car recommendations and shipping estimates</text>
      </g>

      <g transform="translate(0, 630)">
          <rect x="0" y="0" width="20" height="20" rx="4" stroke="#D1D5DB" fill="#FFFFFF" />
          <text x="30" y="15" font-size="14" font-weight="bold" fill="#111827">Accept terms and conditions</text>
          <text x="30" y="35" font-size="12" fill="#6B7280">I agree to the PickAuto Terms of Service and Privacy Policy regarding my account data.</text>
      </g>

      <g transform="translate(0, 690)">
        <rect width="420" height="50" rx="8" fill="#007bff" />
        <text x="210" y="30" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Create My Account</text>
      </g>

      <text x="210" y="770" font-size="14" fill="#007bff" text-anchor="middle">Already have a PickAuto account? <tspan font-weight="bold">Sign In Here</tspan></text>

    </g>

    <line x1="0" y1="950" x2="500" y2="950" stroke="#F3F4F6" />
    <g transform="translate(40, 980)">
        <g>
            <circle cx="20" cy="20" r="20" fill="#EFF6FF" />
            <text x="20" y="25" text-anchor="middle" font-size="16">🔒</text>
            <text x="50" y="15" font-size="14" font-weight="bold" fill="#111827">Secure Data</text>
            <text x="50" y="35" font-size="12" fill="#6B7280">256-bit Encryption</text>
        </g>
        <g transform="translate(0, 60)">
            <circle cx="20" cy="20" r="20" fill="#EFF6FF" />
            <text x="20" y="25" text-anchor="middle" font-size="16">★</text>
            <text x="50" y="15" font-size="14" font-weight="bold" fill="#111827">Exclusive Deals</text>
            <text x="50" y="35" font-size="12" fill="#6B7280">Members-only pricing</text>
        </g>
        <g transform="translate(0, 120)">
            <circle cx="20" cy="20" r="20" fill="#EFF6FF" />
            <text x="20" y="25" text-anchor="middle" font-size="16">🔧</text>
            <text x="50" y="15" font-size="14" font-weight="bold" fill="#111827">Expert Support</text>
            <text x="50" y="35" font-size="12" fill="#6B7280">24/7 Car Concierge</text>
        </g>
    </g>

  </g>

  <g transform="translate(0, 1400)">
      <rect width="1200" height="100" fill="#1F2937" />
      <g transform="translate(60, 40)">
        <text x="0" y="0" font-size="12" fill="#9CA3AF">© 2026 PickAuto Global Inc. All rights reserved.</text>
        <text x="0" y="20" font-size="12" fill="#9CA3AF">Support: help@pickauto.com</text>
        <text x="1080" y="0" font-size="12" fill="#9CA3AF" text-anchor="end">Privacy Policy • Cookies Policy • Regulatory Disclosure</text>
      </g>
  </g>
</svg>